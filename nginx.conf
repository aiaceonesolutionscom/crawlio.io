server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-heavy responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers (CSP deliberately relaxed — Clerk + inline assets need it).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Long-lived asset caching: Vite hashes every build artifact, so cache them
    # hard and never revalidate (the hash changes on deploy).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + websocket: proxy to the backend service. All API paths are prefixed
    # /api/v1, so a single location keeps this clean.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Agent realtime websocket lives at /api/v1/agent/ws.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback: every unmatched path serves index.html so client-side routes
    # (e.g. /app/pro/leads, /admin) work on refresh / direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}